openapi: '3.1.0'
info:
  title: Sherpa Web API
  version: '0.1.1'
  description: |
    Sherpa API endpoints

servers:
  - description: Sherpa Production Server
    url: https://sherpa.gruene.de/sherpa/ws/m2m/

tags:
  - name: any
    description: Every sherpa certificate has the permission "ANY" and should be able to access these common endpoints
  - name: mailinglists
    description: Sherpa Mailinglists Endpoints
  - name: saml
    description: Sherpa SAML Endpoints
  - name: gnetz
    description: Grünes Netz Endpoints

security:
  - mutualTLS: []

paths:
  # any endpoints
  /any/v1/divisions:
    get:
      operationId: AnyFindDivisions
      description: Get a list of all divisions
      summary: find divisions
      tags:
        - any
      responses:
        '200':
          description: List of Divisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyDivision'

  /any/v1/tags:
    get:
      operationId: AnyFindTags
      description: Get a list of all tags
      summary: find tags
      tags:
        - any
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyTag'

  /any/v1/roles:
    get:
      operationId: AnyFindRoles
      description: Get a list of all roles
      summary: find roles
      tags:
        - any
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnyRole'

  /any/v1/alive:
    get:
      operationId: AnyGetAlive
      description: Healthcheck endpoint
      summary: healthcheck
      tags:
        - any
      responses:
        '200':
          description: healthcheck response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerAliveDto'

  # mailinglist endpoints
  /mailinglists/v1/users:
    get:
      operationId: MlFindUsers
      summary: find mailinglist users
      tags:
        - mailinglists
      parameters:
        - name: division
          in: query
          description: Filter by division id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of users. When a non-existing division id is sent, an empty array is returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlUserItem'
        '404':
          description: Division id contains non-parsable string value
        '500':
          description: Missing division id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.NullPointerException'
                originalMessage: null
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: "java.lang.NullPointerException\n\tat ..."
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 10:43:48, 56 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

    put:
      operationId: MlUpsertUser
      summary: create or update mailinglist user
      description: Create or update mailinglist-user
      tags:
        - mailinglists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlUpsertUserDto'
      responses:
        '200':
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlUserItem'
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlUserItem'
        '500':
          description: Bad Request, Not found, Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              examples:
                Bad Request:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'javax.servlet.ServletException'
                    originalMessage: "com.fasterxml.jackson.core.JsonParseException: Unexpected character ('}' (code 125)): was expecting double-quote to start field name\n at [Source: (org.apache.catalina.connector.CoyoteInputStream); line: 6, column: 2]"
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'javax.servlet.ServletException: '
                    serverInfo: 'server info not available'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null
                Not Found:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'java.lang.RuntimeException'
                    originalMessage: 'de.maxmomentum.extern.exception.ResourceNotFoundException: user not found (ext id 16.999.635)'
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'java.lang.RuntimeException: de'
                    serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 13:44:54, 58 active users)'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null

  /mailinglists/v1/users/{userId}:
    get:
      operationId: MlGetUser
      summary: get mailinglist user
      tags:
        - mailinglists
      parameters:
        - name: userId
          in: path
          required: true
          description: The mailinglist-user id (not sherpa user id)
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlUser'
        '400':
          description: Parameter id contains forbidden characters (%)
          content:
            text/html: {}
        '404':
          description: Parameter id contains a non-parsable string value
        '500':
          description: User with given external id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.RuntimeException'
                originalMessage: 'de.maxmomentum.extern.exception.ResourceNotFoundException: user not found (ext id 16.960.158)'
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: 'java.lang.RuntimeException: ...'
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 11:00:22, 64 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null
    delete:
      operationId: MlDeleteUser
      summary: delete mailinglist user
      tags:
        - mailinglists
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
      responses:
        '204':
          description: User deleted
        '404':
          description: User id contains non-parsable string value
        '500':
          description: User with given sherpa id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.RuntimeException'
                originalMessage: 'de.maxmomentum.extern.exception.ResourceNotFoundException: unknown user (user ext id 1.820.580.123)'
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: 'java.lang....'
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 12:09:45, 74 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

  /mailinglists/v1/users/sherpa-id/{sherpaId}:
    get:
      operationId: MlGetUserBySherpaId
      summary: get mailinglist user by sherpa id
      tags:
        - mailinglists
      parameters:
        - name: sherpaId
          in: path
          description: Sherpa User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlUser'
        '400':
          description: Parameter id contains forbidden characters (%)
          content:
            text/html: {}
        '404':
          description: Parameter id contains a non-parsable string value
        '500':
          description: User with given sherpa id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.RuntimeException'
                originalMessage: 'de.maxmomentum.extern.exception.ResourceNotFoundException: user not found (amv pk 18.205.802)'
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: 'java.lang.RuntimeException: de.maxmomentum.ext'
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 12:01:57, 74 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

  /mailinglists/v1/divisions:
    get:
      operationId: MlFindDivisions
      summary: find divisions
      tags:
        - mailinglists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlDivision'

  /mailinglists/v1/divisions/{divisionId}:
    get:
      operationId: MlGetDivision
      summary: get division
      tags:
        - mailinglists
      parameters:
        - name: divisionId
          in: path
          required: true
          description: Division ID
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlDivision'
        '400':
          description: Parameter id contains forbidden characters (%)
          content:
            text/html: {}
        '404':
          description: Parameter id contains a non-parsable string value
        '500':
          description: Division with given id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.RuntimeException'
                originalMessage: 'java.lang.IllegalStateException: structure not found (pk 8.198.000)'
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: 'java.lang.RuntimeException: j...'
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 13:17:42, 50 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

  /mailinglists/v1/subscriptions:
    get:
      operationId: MlFindSubscriptions
      summary: find subscriptions
      tags:
        - mailinglists
      description: Get subscriptions of users to mailinglists. At least one filter parameter is required but not all. When given user id or list id does not exist, an empty array is returned.
      parameters:
        - name: list
          in: query
          description: Filter by mailinglist id
          schema:
            type: string
        - name: user
          in: query
          description: Filter by mailinglist-user id (not sherpa user id)
          schema:
            type: string
        - name: email
          in: query
          description: Filter by email. Email address has to be complete.
          schema:
            type: string
      responses:
        '200':
          description: If given mailinglist id does not exist, an empty array is returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlSubscription'
        '404':
          description: parameter `list` contains non-parsable string
        '500':
          description: Bad Request, Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              examples:
                Bad Request:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'java.lang.RuntimeException'
                    originalMessage: 'java.lang.IllegalArgumentException: at least one information is needed, user id or list id or email'
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'java.lang.RuntimeException:'
                    serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 17:26:12, 25 active users)'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null
    put:
      operationId: MlAddSubscription
      summary: add subscription
      tags:
        - mailinglists
      description:
        Subscribe a user to a mailinglist, who is not assigned by a sherpa distributor.
        A subscription cannot be updated with this endpoint.
        Even though the combination of list id and user id would be assumed as unique,
        sending a request with a (listId, userId) and a different email will not update the subscription but insert a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MlAddSubscriptionDto'
      responses:
        '201':
          description: The User was newly subscribed to the List
        '500':
          description: Not Found, Unprocessable Entity, Bad Request, Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              examples:
                Unprocessable Entity:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'java.lang.RuntimeException'
                    originalMessage: 'java.lang.IllegalStateException: subscription already exists (ext user id 17.000.578, ext list id 13.307.909, email john.doe@exampl.ecom)'
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'java.lang.RuntimeException: java.lang.IllegalStateException: subscripti...'
                    serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-27 17:40:00, 9 active users)'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null
                Not Found:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'java.lang.RuntimeException'
                    originalMessage: 'java.lang.IllegalStateException: mailinglist not found (list ext id 13.307.909.123.123.123)'
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'java.lang.RuntimeException: java.lang.IllegalStateException: mailinglist not found (li...'
                    serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-27 17:46:13, 9 active users)'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null
                Bad Request:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'javax.servlet.ServletException'
                    originalMessage: "com.fasterxml.jackson.databind.exc.InvalidFormatException: Cannot deserialize value of type `long` from String \"asd\": not a valid `long` value\n at [Source: (org.apache.catalina.connector.CoyoteInputStream); line: 3, column: 11] (through reference chain: de.maxmomentum.extern.to.verdigado.mailinglist.VerdigadoMailinglistSubscriptionTO[\"list\"])"
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'javax.servlet.ServletException: com.fasterxml.jackson.databind.ex...'
                    serverInfo: 'server info not available'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null

    delete:
      operationId: MlDeleteSubscriptions
      summary: delete subscriptions
      tags:
        - mailinglists
      description: Unsubscribe users from mailinglists matching the query parameters
      # TODO: check what happens if no query parameters are given. It could throw an error or delete subscriptions of all users from all lists
      parameters:
        - name: user
          in: query
          description: Delete subscriptions matching this user id
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: Delete subscriptions matching this email
          schema:
            type: string
        # TODO: Clarify if parameters scope and target still exist. They are currently not used and it seems they got discarded
        # - name: scope
        #   in: query
        #   required: false
        #   schema:
        #     type: string
        #     enum:
        #       - list
        #       - division
        #       - distributor
        #       - global
        #     default: list
        # - name: target
        #   in: query
        #   required: false
        #   description: List ID, Division ID, SherpaDistributor ID or null for global
        #   schema:
        #     type: integer
        #     nullable: true
      responses:
        '204':
          description: Subscriptions got deleted

  /mailinglists/v1/unsubscriptions:
    get:
      operationId: MlFindUnsubscriptions
      summary: find unsubscriptions
      tags:
        - mailinglists
      description: Get a list of Unsubscriptions of a List
      parameters:
        - name: list
          in: query
          required: true
          description: List ID
          schema:
            type: string
      responses:
        '200':
          description: If given mailinglist id does not exist, an empty array is returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlUnsubscription'
        '404':
          description: parameter `list` contains non-parsable string
    put:
      operationId: MlAddUnsubscription
      summary: add unsubscription
      tags:
        - mailinglists
      description: Unsubscribe an email from a List
      parameters:
        - name: list
          in: query
          required: true
          description: List ID
          schema:
            type: string
        - name: email
          in: query
          required: true
          description: Email to unsubscribe from the List
          schema:
            type: string
      responses:
        '200':
          description: Okay
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlUnsubscription'
        '404':
          description: Parameter `list` contains non-parsable string
        '500':
          description: Not found, Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
    delete:
      operationId: MlDeleteUnsubscription
      summary: delete unsubscription
      tags:
        - mailinglists
      description: Delete an single mailinglist unsubscription by mailing list id and email
      parameters:
        - name: list
          in: query
          required: true
          description: List ID
          schema:
            type: string
        - name: email
          in: query
          required: true
          description: Unsubscribed email in a List
          schema:
            type: string
      responses:
        '200':
          description: Okay
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlUnsubscription'
        '204':
          description: Unsubscription removed
        '500':
          description: Not Found, Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              examples:
                Not Found:
                  value:
                    toType: 'ExceptionTO'
                    exceptionClassName: 'java.lang.RuntimeException'
                    originalMessage: 'java.lang.IllegalStateException: result not unique (list id 13.480.491, email john.doe@example.com)'
                    httpStatusCode: '500'
                    userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                    stackTrace: 'java.lang.RuntimeException: java.lang.IllegalStateException: re...'
                    serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-27 18:45:37, 13 active users)'
                    requestUuid: null
                    source: 'server'
                    type: 'SERVER_GENERAL'
                    code: null

  /mailinglists/v1/lists:
    get:
      operationId: MlFindMailinglists
      summary: find mailinglists
      tags:
        - mailinglists
      parameters:
        - name: division
          in: query
