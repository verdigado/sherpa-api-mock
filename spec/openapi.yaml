components:
  parameters:
    # gnetz parameters
    GnProfileId:
      name: profileId
      in: path
      required: true
      description: User profile id
      schema:
        type: string
        format: uuid
        example: 569f8341-087e-4c37-8c1a-ed31b246ef2a

  responses:
    # saml responses
    SamlServerError:
      description: Generic error response for authentication, validation and others
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SamlError'

    # gnetz responses
    GnNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GnError'
          example:
            id: 17405cfc-4b50-987e
            timestamp: '2023-11-30T13:24:25.298Z'
            exceptionClassName: com.proximity.gp.common.exception.ResourceNotFoundException
            message: Could not find Profile with id 569f8341-087e-4c37-8c1a-ed31b246ef2a
            validationErrors: null

    GnValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GnError'
          example:
            id: 17405cfc-4b50-987e
            timestamp: '2023-11-30T13:24:25.298Z'
            exceptionClassName: com.proximity.gp.common.exception.ValidationException
            message: Invalid Request Body
            validationErrors:
              - path: division.level
                constraints:
                  - type: isEnum
                    message: "'foobar' is not a valid division level"

  schemas:
    # general schemas shared by all api endpoints

    DivisionKey:
      type: string
      description: >
        External Division identifier.
          - First digit is the index of the hierarchy
            1. GR
            2. GJ
            3. KPV
          - second and third digit is the *LV*
          - next three is the *KV*
          - last two is the *OV*
        All undefined hierarchy levels are nulled.
      example: '10000000'
      # examples: # from OAS 3.1 on
      #   warstein:
      #     summary: OV Warstein
      #     description: GR - NRW - SO - Warstein
      #     value: "11004613"
      #   bv:
      #     summary: Bundesverband GJ
      #     description: GJ - null - null - null - null
      #     value: "20000000"
      minLength: 8
      maxLength: 8
      pattern: '^[1-9][0-9]{7}$'

    HierarchyType:
      description: >
        The root hierarchy the Division belongs to:
          - `GR`: Division of the Green Party ("BÜNDNIS 90/DIE GRÜNEN")
          - `GJ`: Division of the Green Youth ("Grüne Jugend")
          - `KPV`: Local political Association ("Kommunalpolitische Vereinigung"), currently not in use
      type: string
      enum:
        - GR
        - GJ
        - KPV

    # any schemas
    AnyDivision:
      type: object
      properties:
        internalId:
          type: string
          example: '4086'
          description: Global unique id. This id has no collisions with organization or user ids.
        divisionKey:
          $ref: '#/components/schemas/DivisionKey'
          example: '10100101'
        hierarchy:
          $ref: '#/components/schemas/HierarchyType'
          example: 'GR'
        level:
          type: string
          enum:
            - bv
            - lv
            - kv
            - ov
          example: ov
        name1:
          type: string
          description: Bezeichnung der Gliederungsebene (Bundesverband/Landesverband/Kreisverband/Ortsverband | Abteilung | Regionalverband)
          example: Ortsverband
        name2:
          type: string
          description: >
            Name der jeweiligen Abteilung.
            Aufgelöste Gliederungen haben den Suffix `_ALT` angefügt.
            Über diesen Suffix können Gliederungen gefiltert werden nach aktiv/inaktiv.
          example: Aalen
        shortName:
          type: string
          example: Aalen OV
        officeZip:
          type: [string, 'null']
          description: zip code of office location
          example: '25488'
        officeStreet:
          type: [string, 'null']
          description: street name of office location
          example: 'Bahnhofstr.'
        officeHouseNumber:
          type: [string, 'null']
          description: house number of office location
          example: '13'
        officeCity:
          type: [string, 'null']
          description: city of office location
          example: 'Berlin'
        favoriteEmail:
          type: [string, 'null']
          description: the preferred email to contact the division
          example: 'info@example.com'
        urls:
          type: array
          description: list of internet presences
          items:
            type: string
          example: ['https://example.com/']
        emails:
          type: array
          items:
            type: string
          example: ['john.doe@example.com', 'jane.doe@example.com']
        emailTags:
          type: object
          additionalProperties:
            type: string
          example: { 'jane.doe@example.com': 'BV-GRÜNE-Info' }
        emailPurpose:
          description: |
            purposes associated with email
            currently used values:
              - privat
              - grüne
              - dienstlich
              - Postanschrift
              - Rechnungsanschrift
              - Lieferanschrift
          type: object
          additionalProperties:
            type: object
            required:
              - id
              - label
            properties:
              id:
                type: string
                example: '12'
              label:
                type: string
                example: 'grüne'
          example: { 'jane.doe@example.com': { 'id': '2', 'label': 'grüne' } }
      required:
        - internalId
        - divisionKey
        - hierarchy
        - level
        - name1
        - name2
        - shortName
        - officeZip
        - officeStreet
        - officeHouseNumber
        - officeCity
        - emails
        - emailTags
        - emailPurpose
        - favoriteEmail
        - urls

    AnyTag:
      type: object
      properties:
        id:
          type: string
          example: '691378'
        parentId:
          type: [string, 'null']
          example: '236'
        name:
          type: string
          example: Technik Parteitag
        aliases:
          type: array
          items:
            type: object
      required:
        - id
        - parentId
        - name
        - aliases

    AnyRole:
      type: object
      properties:
        id:
          type: string
          example: '12272402'
        type:
          type: string
          description: >
            A: Amt
            B: Beziehung
            M: Mandat
            R: Rolle
            S: System
          enum:
            - A
            - B
            - M
            - R
            - S
          example: R
        label:
          type: string
          example: LAG Regionaler Strukturwandel Mitarbeitende
        hierarchy:
          type: [string, 'null']
          enum:
            - gr
            - gj
            - kpv
            - null
        level:
          type: string
          description: A role can be scoped to a particular hierarchy level or for all
          enum:
            - all
            - bv
            - lv
            - kv
            - ov
            - bezv
        maxAge:
          type: integer
          example: 99
        minAge:
          type: [integer, 'null']
          example: 0
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AnyRoleCategory'
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/AnyRoleAlias'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/AnyRoleTag'
      required:
        - id
        - type
        - label
        - hierarchy
        - level
        - maxAge
        - minAge
        - categories
        - aliases
        - tags

    AnyRoleCategory:
      type: object
      properties:
        id:
          type: string
          example: '308'
        label:
          type: string
          example: LAG Regionaler Strukturwandel
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/AnyRoleAlias'
      required:
        - id
        - label
        - aliases

    AnyRoleAlias:
      type: object
      properties:
        id:
          type: string
          example: '308'
        label:
          type: string
          example: Parteirat
        divisionId:
          type: integer
          example: 8671
        divisionKey:
          $ref: '#/components/schemas/DivisionKey'
      required:
        - id
        - label
        - divisionId
        - divisionKey

    AnyRoleTag:
      type: object
      properties:
        id:
          type: string
          example: '7023839'
        tagId:
          type: string
          example: '6590132'
        name:
          type: string
          example: eShop Rolle
      required:
        - id
        - tagId
        - name

    ServerAliveDto:
      type: object
      properties:
        toType:
          type: string
          example: ServerAliveTO
        alive:
          type: boolean
          example: true
        serverInfo:
          type: string
          example: Live-System (Version 1.5-24, Serverzeit 2023-12-06 17:03:15, 43 active users)

    # mailinglist schemas
    MlUser:
      type: object
      description: A natural person, an AMVparty in Sherpa
      required:
        - id
        - sherpaPartyId
        - email
        - name
        - divisions
      properties:
        id:
          type: integer
          example: 12795114
          description: Mailinglist-user id.
        sherpaPartyId:
          description: The sherpa user id
          type: [integer, 'null']
          example: 12795004
        email:
          type: [string, 'null']
          format: email
          description: A user's default e-mail
          example: user@example.org
        name:
          type: [string, 'null']
          description: Users display name. Contains the Gnetz username
          example: johndoe1
        divisions:
          type: array
          items:
            $ref: '#/components/schemas/MlDivision'

    MlUpsertUserDto:
      type: object
      properties:
        id:
          description: User id. Leave empty/null to create new user. No check for duplicates
          type: [integer, 'null']
        sherpaPartyId:
          description: The sherpa user id
          type: [integer, 'null']
          example: 12795004
        email:
          type: [string, 'null']
          format: email
          description: A user's default e-mail
          example: user@example.org
        name:
          type: [string, 'null']
          description: username
          example: johndoe1
        divisions:
          description: list of division ids
          type: [array, 'null']
          items:
            type: integer
          example:
            - 10689
            - 11326

    MlUserItem:
      type: object
      description: A compact version of MlUser
      required:
        - id
        - sherpaPartyId
        - name
        - email
        - divisions
      properties:
        id:
          type: integer
          example: 12795004
        sherpaPartyId:
          description: The sherpa user id
          type: [integer, 'null']
          example: 1820005
        email:
          type: [string, 'null']
          format: email
          description: A user's default e-mail
          example: user@example.org
        name:
          type: [string, 'null']
          description: Display name. Contains the Gnetz username.
          example: johndoe5
        divisions:
          description: list of division ids
          type: [array, 'null']
          items:
            type: integer
          example:
            - 10689
            - 11326

    MlDivision:
      type: object
      description: A division (dt. Gliederung) of the party and it's associated mailing lists.
      required:
        - id
        - identifier
        - parentId
        - name
        - shortDescription
        - hierarchy
        - hierarchyLevel
        - lists
        - distributors
      properties:
        id:
          type: integer
          example: 10689
        identifier:
          $ref: '#/components/schemas/DivisionKey'
        parentId:
          type: [integer, 'null']
          description: Parent division id
          example: 9641
        name:
          type: string
          description: Full name of the division
          example: Kreisverband Herne
        shortDescription:
          type: string
          description: Contains the `shortName` of the division
          example: Herne KV
        hierarchy:
          $ref: '#/components/schemas/HierarchyType'
        hierarchyLevel:
          type: integer
          description: >
            The level of the Division in said hierarchy, whilst not all hierarchies have all levels:
              - `1`: BV ("Bundesverband")
              - `2`: LV ("Landesverband")
              - `3`: BezV ("Bezirksverband"), not always used
              - `4`: KV ("Kreisverband")
              - `5`: OV ("Ortsverband")
          minimum: 1
          maximum: 5
          example: 4
        lists:
          type: array
          items:
            $ref: '#/components/schemas/MlMailinglist'
        distributors:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/MlSherpaDistributor'

    MlMailinglist:
      type: object
      description: A mailing list, as managed by Sympa/Mailman
      required:
        - id
        - name
        - description
        - isunsubscribeable
        - visibility
        - divisionId
        - subscriberSyncToken
        - distributors
      properties:
        id:
          type: integer
          example: 12345
        name:
          type: string
          example: Test Externe Mailinglisten
        description:
          type: [string, 'null']
          example: Mailingliste zum Sherpa-Verteiler \"Test Externe Mailinglisten\"
        isunsubscribeable:
          type: boolean
          description: A user can unsubscribe itself from the list
        visibility:
          type: string
          enum:
            - public
            - partymember
            - divisionmember
            - internal
        divisionId:
          type: [integer, 'null']
          example: 2084
        subscriberSyncToken:
          description: A static alphanumeric token, used to authenticate against the Backend to read subscriber lists
          type: string
          readOnly: true
          minLength: 64
          maxLength: 64
          example: b7JETuh0tDWEXJjyKrA6wmPBeoqJW4RXOuGEhgn0JBuAlt59VkTaGr5FoN2H051T
        distributors:
          description: list of sherpa distributor ids
          type: array
          items:
            type: integer
          example: [123, 124]

    MlUpsertMailinglistDto:
      type: object
      required:
        - name
        - visibility
      properties:
        id:
          description: Leave empty or set to null to create a new entry
          type: [integer, 'null']
          example: 12345
        name:
          type: string
          example: Test Externe Mailinglisten
        description:
          type: [string, 'null']
          example: Mailingliste zum Sherpa-Verteiler \"Test Externe Mailinglisten\"
        isunsubscribeable:
          type: boolean
          description: A user can unsubscribe itself from the list.
          default: false
        visibility:
          type: string
          enum:
            - public
            - partymember
            - divisionmember
            - internal
        divisionId:
          type: [integer, 'null']
          example: 2084
        distributors:
          description: list of sherpa distributor ids
          type: [array, 'null']
          items:
            type: integer
          example: [123, 124]

    MlSubscription:
      type: object
      required:
        - user
        - list
        - email
        - userGender
        - userSurname
        - userPrename
      properties:
        user:
          description: mailinglist-user id (not sherpa user id)
          type: integer
        list:
          description: mailing list id
          type: integer
        email:
          type: string
          format: email
          example: user+list@example.org
        # userGender, userSurname, userPrename are always null after a MlAddSubscription request.
        # They are resolved on MlFindSubscriptions when a sherpa user is linked to the mailinglist user
        userGender:
          type: [string, 'null']
          enum:
            - m
            - w
            - d
          example: m
        userSurname:
          type: [string, 'null']
          example: Doe
        userPrename:
          type: [string, 'null']
          example: Doe

    MlAddSubscriptionDto:
      type: object
      required:
        - user
        - list
        - email
      properties:
        user:
          description: mailinglist-user id (not sherpa user id)
          type: integer
        list:
          description: mailing list id
          type: integer
        email:
          type: string
          format: email
          example: user@example.org

    MlUnsubscription:
      type: object
      required:
        - id
        - list
        - email
      properties:
        id:
          type: integer
        list:
          type: integer
        email:
          type: string
          format: email
          example: user+list@example.org

    MlSherpaDistributor:
      type: object
      description: Link between Sherpa-Selektionen and Mailinglists, usually of the type "E-Mail-Verteiler (distributor)"
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 9489
        name:
          type: string
          example: Test Externe Mailinglisten

    MlSherpaDistributorItem:
      type: object
      description: User and associated email address in sherpa distributor
      required:
        - sherpaPartyId
        - email
      properties:
        sherpaPartyId:
          description: sherpa user id
          type: integer
          example: 14366003
        email:
          type: string
          format: email
          example: john.doe@example.com
        userGender:
          type: string
          enum:
            - m
            - w
            - d
          example: m
        userSurname:
          type: string
          example: Doe
        userPrename:
          type: string
          example: Doe

    MlErrorDto:
      type: object
      required:
        - toType
        - exceptionClassName
        - originalMessage
        - httpStatusCode
        - userMessage
        - stackTrace
        - serverInfo
        - requestUuid
        - source
        - type
        - code
      properties:
        toType:
          type: string
          example: ExceptionTO
        exceptionClassName:
          type: string
          example: java.lang.NullPointerException
        originalMessage:
          type: [string, 'null']
        httpStatusCode:
          type: string
          example: '500'
        userMessage:
          type: string
          description: Message to the user on frontend
          example: Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.
        stackTrace:
          type: string
        serverInfo:
          type: string
        requestUuid:
          type: [string, 'null']
        source:
          type: string
          example: server
        type:
          type: string
          example: SERVER_GENERAL
        code:
          type: [string, 'null']

    # SAML schemas
    SamlFindUsersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SamlUser'
        meta:
          type: object
          properties:
            hasNext:
              type: boolean
              description: Whether a next page exists or not
      required:
        - data
        - meta

    SamlNewUser:
      type: object
      description: new user
      properties:
        toType:
          type: string
          example: SamlOnboardingPartyTO
        id:
          type: string
          description: sherpa user id
          example: '12345678'
        name1:
          type: string
          description: Firstname
          example: John
        name2:
          type: string
          description: Lastname
          example: Doe
        email:
          type: [string, 'null']
          format: email
          example: john.doe@example.com
      required:
        - toType
        - id
        - name1
        - name2
        - email

    SamlUser:
      type: object
      properties:
        toType:
          type: string
          example: SamlSynchronizationPartyTO
        id:
          type: string
          description: sherpa user id
          example: '12345678'
        ownerIdentifier:
          $ref: '#/components/schemas/DivisionKey'
        ownerId:
          example: '11002607'
          type: string
        createdOn:
          type: string
          format: date-time
          example: 2020-07-22T13:38:30+0200
        lastModifiedOn:
          type: string
          format: date-time
          example: 2022-11-25T16:45:24+0100
        name1:
          type: string
          example: John
        name2:
          type: string
          example: Doe
        email:
          type: [string, 'null']
          format: email
          example: john.doe@example.com
        blockingNotice:
          description: Sperrvermerk in sherpa. Flag to indicate that user should not receive any emails.
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SamlUserRole'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/SamlUserMembership'
      required:
        - toType
        - id
        - ownerIdentifier
        - ownerId
        - createdOn
        - lastModifiedOn
        - name1
        - name2
        - email
        - roles
        - memberships

    SamlUserRole:
      type: object
      properties:
        toType:
          type: string
          example: SamlSynchronizationRoleAssignmentTO
        id:
          type: string
          example: '13926537'
        ownerIdentifier:
          $ref: '#/components/schemas/DivisionKey'
        roleId:
          type: string
          example: '7555235'
        delegatedByOrganizationIdentifier:
          type: [string, 'null']
          description: can be a division key or an id for a non regular chapter starting with 5
          example: '512345'
        expiresOn:
          type: [string, 'null']
          format: date-time
          description: |
            When the assignment runs out, `null` if it does not expire. Required
            for the guest marker: a consumer has to be able to tell how long a
            guest account is still valid, both from the creating call and from
            the user endpoints, to warn ahead of the expiry and to prompt for a
            renewal.
          example: 2026-12-31T23:59:59+0100
        tags:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/SamlUserRoleTag'
      required:
        - toType
        - id
        - ownerIdentifier
        - roleId
        - delegatedByOrganizationIdentifier
        - expiresOn
        - tags

    SamlUserRoleTag:
      type: object
      properties:
        toType:
          type: string
          example: SamlGenericTagTO
        id:
          type: string
          example: '6592657'
        tagId:
          type: string
          example: '6590132'
        name:
          type: string
          example: eShop Rolle
      required:
        - toType
        - id
        - tagId
        - name

    SamlCreateGuestAccountDto:
      type: object
      description: Data collected from the invited person plus the inviting division
      properties:
        name1:
          type: string
          description: Firstname
          example: Jane
        name2:
          type: string
          description: Lastname
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        birthDate:
          type: string
          format: date
          example: '1990-04-17'
        ownerIdentifier:
          $ref: '#/components/schemas/DivisionKey'
          description: |
            The division the guest was invited to work in. It is picked by the
            inviting member and is not necessarily their own division.
        invitedByUserId:
          type: [string, 'null']
          description: |
            Sherpa user id of the inviting member. Optional: the invitation is
            persisted in the Grüne API anyway. Useful if Sherpa should be able to
            tell whose invitation a guest account goes back to.
          example: '12345678'
      required:
        - name1
        - name2
        - email
        - ownerIdentifier

    SamlUserMembership:
      type: object
      properties:
        toType:
          type: string
          example: SamlSynchronizationMembershipTO
        id:
          type: string
        ownerIdentifier:
          $ref: '#/components/schemas/DivisionKey'
        memberOfStructureIdentifier:
          $ref: '#/components/schemas/DivisionKey'
      required:
        - toType
        - id
        - ownerIdentifier
        - memberOfStructureIdentifier

    SamlError:
      type: object
      properties:
        toType:
          type: string
          example: ExceptionTO
        exceptionClassName:
          type: string
          example: com.proximity.gp.common.exception.InvalidCredentialsException
        originalMessage:
          type: string
          example: api endpoint needs permission for SAML, caller got only GNETZ2
        httpStatusCode:
          type: string
          example: '500'
        userMessage:
          type: string
          example: Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.
        stackTrace:
          type: string
        serverInfo:
          type: string
          example: Live-System (Version 1.4-89, Serverzeit 2023-04-09 09:21:47.519+0200)
        requestUuid:
          type: string
        source:
          type: string
          example: server
        type:
          type: string
          example: INVALID_CREDENTIALS
        code:
          type: string

    # gnetz schemas

    GnDivisionMembership:
      type: object
      properties:
        divisionKey:
          $ref: '#/components/schemas/DivisionKey'
        joinedAt:
          type: string
          format: date-time
          example: '2024-01-01T12:33:41.123Z'
        exitedAt:
          type: [string, 'null']
          format: date-time
          example: '2024-06-01T12:00:00.000Z'
      required:
        - divisionKey
        - joinedAt
        - exitedAt

    GnProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '9677feef-0916-4ee9-bac9-36655950666a'
        userId:
          description: the sherpa user id
          type: string
          example: '12345678'
        personalId:
          description: personal identification number
          type: string
          example: '12345678'
        username:
          type: string
          example: JohnDoe1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        image:
          $ref: '#/components/schemas/GnProfileImage'
        email:
          type: string
          format: email
          example: john.doe@example.com
        loginEmail:
          description: >-
            Login email of the associated gnetz account. Mirrors that account's
            email and, unlike `email`, is not user-editable. `null` when no
            gnetz account is associated.
          type: [string, 'null']
          format: email
          example: john.doe@example.com
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/GnPhoneNumber'
        messengers:
          type: array
          items:
            $ref: '#/components/schemas/GnMessenger'
        socialMedia:
          type: array
          items:
            $ref: '#/components/schemas/GnSocialMedia'
        tags:
          type: [array, 'null']
          items:
            type: string
          example: ['101', '102']
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/GnDivisionMembership'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GnRole'
        achievements:
          type: [array, 'null']
          items:
            type: string
            example: Silberne Sonnenblume
        privacy:
          $ref: '#/components/schemas/GnPrivacySettings'
      required:
        - id
        - userId
        - personalId
        - username
        - firstName
        - lastName
        - image
        - email
        - loginEmail
        - phoneNumbers
        - messengers
        - socialMedia
        - tags
        - memberships
        - roles
        - achievements
        - privacy

    GnImageLink:
      type: object
      properties:
        id:
          description: This field is always returned by sherpa but must be left out when setting a new image for a profile.
          type: string
          example: '10'
        url:
          type: string
          description: Image url
          example: >-
            https://static.example.com/profiles/10b4be70-9e3d-40a5-a46a-b0668bdf7e03.jpg
        mimetype:
          type: string
          description: Image mimetype
          example: image/jpeg
        width:
          type: integer
          description: Width in pixels
          example: 150
        height:
          type: integer
          description: Height in pixels
          example: 150
      required:
        - url
        - mimetype
        - width
        - height

    GnProfileImage:
      type: object
      properties:
        thumbnail:
          oneOf:
            - $ref: '#/components/schemas/GnImageLink'
            - type: 'null'
        large:
          oneOf:
            - $ref: '#/components/schemas/GnImageLink'
            - type: 'null'
      required:
        - thumbnail
        - large

    GnSocialMediaType:
      type: string
      enum:
        - facebook
        - instagram
        - mastodon
        - twitter
        - chatbegruenung

    GnSocialMedia:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/GnSocialMediaType'
          example: twitter
        url:
          type: string
          example: https://twitter.com/johndoe
      required:
        - id
        - type
        - url

    GnUpdateSocialMediaDto:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/GnSocialMediaType'
          example: twitter
        url:
          type: string
          example: https://twitter.com/johndoe
      required:
        - type
        - url

    GnMessengerType:
      type: string
      enum:
        - threema

    GnMessenger:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/GnMessengerType'
          example: threema
        externalId:
          type: string
          example: 'GAvh15G12512125H'
      required:
        - id
        - type
        - externalId

    GnUpdateMessengerDto:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/GnMessengerType'
          example: threema
        externalId:
          type: string
          example: 'GAvh15G12512125H'
      required:
        - type
        - externalId

    GnPhoneNumber:
      type: object
      properties:
        id:
          type: string
        country:
          type: string
          example: '+49'
        number:
          type: string
          example: '17712341234'
      required:
        - id
        - country
        - number

    GnUpdatePhoneNumberDto:
      type: object
      properties:
        id:
          type: string
        country:
          type: string
          example: '+49'
        number:
          type: string
          example: '17712341234'
      required:
        - country
        - number

    GnVisibility:
      type: string
      enum:
        - private
        - public
        - bv_wide
        - lv_wide
        - kv_wide
        - ov_wide

    GnPrivacySettings:
      type: object
      properties:
        overall:
          oneOf:
            - $ref: '#/components/schemas/GnVisibility'
            - type: 'null'
          example: public
        email:
          oneOf:
            - $ref: '#/components/schemas/GnVisibility'
            - type: 'null'
          example: public
        chatbegruenung:
          oneOf:
            - $ref: '#/components/schemas/GnVisibility'
            - type: 'null'
          example: public
      required:
        - overall
        - email
        - chatbegruenung

    GnProfileFormValues:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
            example: john.doe@example.com
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/GnPhoneNumber'
        messengers:
          type: array
          items:
            $ref: '#/components/schemas/GnMessenger'
        socialMedia:
          type: array
          items:
            $ref: '#/components/schemas/GnSocialMedia'

    GnCreateProfileDto:
      type: object
      properties:
        id:
          type: string
          description: A pre-generated uuid as primary id for the new profile
          format: uuid
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        loginEmail:
          description: Login email pushed from the associated gnetz account. `null` when there is no associated login.
          type: [string, 'null']
          format: email
        privacy:
          oneOf:
            - $ref: '#/components/schemas/GnPrivacySettings'
            - type: 'null'
      required:
        - id
        - userId
        - username
        - email

    GnUpdateProfileDto:
      type: object
      properties:
        userId:
          description: This field is immutable but has to be send in payload
          type: string
        username:
          type: string
        email:
          type: string
        loginEmail:
          description: Login email pushed from the associated gnetz account. `null` when there is no associated login.
          type: [string, 'null']
          format: email
        image:
          description: |
            Always send the current image data on update. Marked required to
            prevent accidental data loss: the field can technically be omitted,
            but doing so loses the stored image.
            When adding a new image the ids must not be set.
            When updating a profile with unchanged image the ids must be sent along.
          $ref: '#/components/schemas/GnProfileImage'
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/GnUpdatePhoneNumberDto'
        messengers:
          type: array
          items:
            $ref: '#/components/schemas/GnUpdateMessengerDto'
        socialMedia:
          type: array
          items:
            $ref: '#/components/schemas/GnUpdateSocialMediaDto'
        tags:
          type: array
          items:
            type: string
          example: ['101', '102']
        privacy:
          $ref: '#/components/schemas/GnPrivacySettings'
      required:
        - userId
        - username
        - email
        - image
        - phoneNumbers
        - messengers
        - socialMedia
        - tags
        - privacy

    GnDeletedProfileDto:
      type: object
      properties:
        id:
          type: string
          example: 0de14cbe-221b-43a5-8222-45414066f5b6
        userId:
          type: string
          example: '12345678'
      required:
        - id
        - userId

    GnTagType:
      type: string
      enum:
        - skill
        - interest

    GnTag:
      type: object
      properties:
        id:
          type: string
          example: '1'
        type:
          $ref: '#/components/schemas/GnTagType'
        externalId:
          type: string
          example: '101'
          description: id for this tag by another system/cms
        tag:
          type: string
          example: Zeitpolitik
      required:
        - id
        - tag
        - type

    GnRoleType:
      type: string
      enum:
        - role
        - mandate
        - office

    GnRole:
      type: object
      properties:
        id:
          description: This ID refers to the m:n relation mapping
          type: string
          example: '12345'
        roleId:
          description: This ID refers to the role itself
          type: integer
          example: 12345
        type:
          $ref: '#/components/schemas/GnRoleType'
        name:
          type: string
          example: LAG Verkehr Mitarbeitende
        alias:
          type: string
          example: LAG Mobilität
      required:
        - id
        - roleId
        - type
        - name
        - alias

    GnError:
      type: object
      properties:
        id:
          type: string
          example: 17405cfc-4b50-987e
          description: unique error id
        timestamp:
          type: string
          format: date-time
          example: '2023-11-30T13:24:25.298Z'
        exceptionClassName:
          type: string
          example: com.proximity.gp.common.exception.InvalidCredentialsException
        message:
          type: string
          example: 'invalid request data'
        validationErrors:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/GnValidationError'
      required:
        - id
        - timestamp
        - exceptionClassName
        - message
        - validationErrors

    GnValidationError:
      type: object
      properties:
        path:
          type: string
          example: 'division.type'
        constraints:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: 'isEnum'
              message:
                type: string
                example: "'foobar' is not a valid division type'"
            required:
              - type
              - message

  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: >-
        The API authenticates callers solely by client certificate (mutual
        TLS). The certificate must be signed by the `Sherpa API CA` and carries
        the caller's permissions. mTLS is established at the transport layer, so
        the generated client does not handle it — configure your HTTP client
        (e.g. an axios `httpsAgent`) with the certificate and key.
