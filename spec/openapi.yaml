                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

  /mailinglists/v1/internal-subscribers:
    get:
      operationId: MlFindInternalSubscribers
      summary: find internal subscribers
      tags:
        - mailinglists
      parameters:
        - name: distributor
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Okay
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MlSherpaDistributorItem'
        '404':
          description: Parameter distributor contains a non-parsable string value
        '500':
          description: distributor with given id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlErrorDto'
              example:
                toType: 'ExceptionTO'
                exceptionClassName: 'java.lang.RuntimeException'
                originalMessage: 'java.lang.IllegalStateException: com.proximity.gp.server.common.exception.ObjectNotAccessibleException: cannot find owner (distributor id 5.163.000)'
                httpStatusCode: '500'
                userMessage: 'Bei der Verarbeitung der Anfrage ist ein Fehler aufgetreten.'
                stackTrace: 'java.lang.RuntimeException...'
                serverInfo: 'Live-System (Version 1.5-31, Serverzeit 2024-04-12 14:34:58, 45 active users)'
                requestUuid: null
                source: 'server'
                type: 'SERVER_GENERAL'
                code: null

  /mailinglists/v1/banned-emails:
    get:
      operationId: MlFindBannedEmails
      summary: find banned emails
      tags:
        - mailinglists
      description: Get a list of emails which are NOT allowed to log in. Only implemented by Sherpa!
      responses:
        '200':
          description: Okay
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: email

  # saml endpoints
  /saml/party/newusers:
    post:
      operationId: SamlFindNewUsersByDate
      summary: Find new users by date
      description: Find created users by date. Response does not include memberships or roles.
      tags:
        - saml
      requestBody:
        required: true
        description: Find new user params
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  example: 2021-01-27T16:50:37+0100
                to:
                  type: string
                  format: date-time
                  example: 2021-01-28T16:50:37+0100
              required:
                - from
                - to
      responses:
        '200':
          description: List of new users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SamlNewUser'
        '415':
          description: Missing Request Body
        '500':
          $ref: '#/components/responses/SamlServerError'

  /saml/party/list:
    post:
      operationId: SamlGetUsersById
      summary: Get users by ids
      description: Get detailed information about users and their memberships and roles by id.
      tags:
        - saml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partyIdList:
                  type: array
                  items:
                    type: string
                  example: ['12345678', '12345679']
              required:
                - partyIdList
      responses:
        '200':
          description: List of new users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SamlUser'
        '500':
          $ref: '#/components/responses/SamlServerError'

  /saml/v1/users:
    get:
      operationId: SamlFindUsers
      summary: Find users
      description: Find and filter users. Get detailed information about the user memberships and roles.
      tags:
        - saml
      parameters:
        - name: limit
          in: query
          required: false
          description: Max amount of users to return
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 200
        - name: after
          in: query
          required: false
          description: Last user id, used for keyset pagination.
          schema:
            type: string
            example: '1234567'
        - name: modified_after
          in: query
          required: false
          description: ISO8601 compliant date. Only list users modified after given date.
          schema:
            type: string
            format: date-time
            example: 2023-01-01T00:00:00+0100
        - name: modified_before
          in: query
          required: false
          description: ISO8601 compliant date. Only list users modified before given date.
          schema:
            type: string
            format: date-time
            example: 2023-02-01T00:00:00+0100
        - name: include[]
          in: query
          required: false
          description: Filter users by user ids
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Find user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlFindUsersResponse'

  /saml/v1/guest-accounts:
    post:
      operationId: SamlCreateGuestAccount
      summary: Create a guest account
      description: |
        Creates a guest account for a person who has no access to the Grünes Netz
        yet, in a single call: create the party record (or reuse the matching
        existing one), check that the person qualifies, and set the guest marker.

        The guest marker must carry an expiry from the start. There must be no
        point in time at which a guest account exists without one. How long that
        expiry runs is Sherpa's to decide — the marker has a default and a
        maximum duration — so the caller sends no duration and reads the
        resulting date off the returned record.

        A person who already has access — a member, or the holder of a role that
        grants access without a membership — does not qualify and is rejected
        with `409`.

        The returned id comes from the same sequence as regular party records. It
        becomes the `uidNumber` in LDAP and is the primary user id across the
        Grünes Netz, so it has to be in the response body.
      tags:
        - saml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamlCreateGuestAccountDto'
      responses:
        '200':
          description: |
            An existing party record was found and marked as a guest. It keeps
            its id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlUser'
        '201':
          description: No party record existed. It was created and marked as a guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlUser'
        '400':
          description: |
            Invalid input: missing required fields, implausible values, unknown
            division.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '403':
          description: The calling certificate is not permitted to use this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '409':
          description: |
            The person already has access to the Grünes Netz and cannot become a
            guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '422':
          description: |
            Several party records match the given data and cannot be resolved
            automatically. Neither one of them is picked nor a new record
            created; the case needs manual clarification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '500':
          $ref: '#/components/responses/SamlServerError'

  /saml/v1/guest-accounts/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Sherpa user id of the guest account
        schema:
          type: string
          example: '41900123'

    patch:
      operationId: SamlRenewGuestAccount
      summary: Renew a guest account
      description: |
        Extends the expiry of an existing guest marker and returns the updated
        party record. Used while the account is still valid, e.g. for a guest
        who keeps helping beyond the end of a campaign.

        Repeating the creating call is not a way to renew. While the marker
        holds, the person has access and no longer qualifies as a guest, so the
        call would be rejected with `409`. Revoking and creating again is not
        one either: it drops the existing role assignment along with its
        history, restarts the deadlines towards anonymization, and lets the
        maximum duration be sidestepped one default duration at a time.

        The new expiry is Sherpa's to determine, the same way it is on creation,
        and is read off the returned record.
      tags:
        - saml
      responses:
        '200':
          description: The guest marker was extended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlUser'
        '403':
          description: The calling certificate is not permitted to use this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '404':
          description: No party record with a guest marker exists for the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '409':
          description: |
            The extension would exceed the maximum duration of the guest marker.
            The account keeps its current expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '500':
          $ref: '#/components/responses/SamlServerError'

    delete:
      operationId: SamlRevokeGuestAccount
      summary: Revoke a guest account
      description: |
        Removes the guest marker from a party record. Used to end a guest's
        access before its expiry, e.g. on abuse. An expired marker ends the
        access on its own and needs no call.

        Removing the account in LDAP alone is not enough: the marker would stay
        in Sherpa and the next user sync would reactivate the guest.
      tags:
        - saml
      responses:
        '204':
          description: The guest marker was removed.
        '403':
          description: The calling certificate is not permitted to use this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '404':
          description: No party record with a guest marker exists for the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlError'
        '500':
          $ref: '#/components/responses/SamlServerError'

