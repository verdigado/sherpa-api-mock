          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlMailinglist'
        '201':
          description: Mailinglist successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlMailinglist'
        '500':
